# Orpheus: one service, and a model beside it.
#
# There was a second service here -- a Plumber API that owned the only write
# connection, with Datasette mounted read-only so the container runtime enforced
# the single-writer rule. Datasette is the writer now, so both halves of that
# arrangement are gone: the API, and the read-only mount that made it safe.

services:
  orpheus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    volumes:
      # Read-write, and it is the only thing that mounts this volume at all.
      - orpheus-data:/data
    environment:
      ORPHEUS_DB: /data/orpheus.sqlite
      ORPHEUS_STORAGE: /data/storage
      ORPHEUS_LOCAL_MODEL: ${ORPHEUS_LOCAL_MODEL:-llama3.1:8b}
      ORPHEUS_OLLAMA_HOST: http://ollama:11434
      # Read only when cloud processing is enabled, which it is not by default,
      # and even then only for a request that opted in.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Signs the session cookie. Without a fixed value every restart signs
      # everyone out.
      DATASETTE_SECRET: ${DATASETTE_SECRET:?set DATASETTE_SECRET in .env}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  orpheus-data:
  ollama-models:
