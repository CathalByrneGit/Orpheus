[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orpheus"
version = "0.2.0"
description = "Document intelligence with provenance, review and measurable extraction quality"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# None. The core is standard library only -- sqlite3, json, re, urllib -- so a
# store can be opened, migrated, read and written by a script with nothing
# installed. Everything below is a capability you opt into, and the code says
# which install is missing when you reach for one you did not.
dependencies = []

[project.optional-dependencies]
# Datasette is the surface and the writer, but the core does not import it, so
# a script or a test can use the store without it.
server = ["datasette>=1.0a32"]
# A chat surface inside Datasette, wired to the store through the tools in
# plugins/orpheus_agent.py. An extra rather than a dependency because it pulls
# datasette-llm and llm behind it, and because the plugin's own pages have to
# keep working when it is absent -- the hook returns nothing and the rest of
# Datasette is unaffected.
agent = ["datasette-agent>=0.1a0"]
# Batch operations with a progress UI, a per-row error table and cancel, over a
# selection the user makes in Datasette. An extra for the same reasons as the
# agent, and pinned to git rather than a release: 0.5.1 on PyPI calls
# `permission_allowed`, which Datasette 1.0 renamed, and 500s on the enrichment
# picker. `main` is fixed and unreleased.
#   pip install 'datasette-enrichments @ git+https://github.com/datasette/datasette-enrichments'
enrichments = ["datasette-enrichments>=0.6a0"]
# Scheduled tasks, run in-process by Datasette. An extra rather than a
# dependency for two reasons. It is 0.0.1a2 -- an alpha, and taking one as a
# hard dependency would contradict the adoption policy in
# docs/datasette-ecosystem.md. And a deployment that schedules nothing should
# not carry a scheduler: plugins/orpheus_cron.py registers nothing when this is
# absent, and `orpheus scheduled run` still runs every task by hand.
cron = ["datasette-cron>=0.0.1a2"]
# The extraction engine. Optional only in the sense that a deployment may
# register its own populator; without one of the two there is no model pass.
llm = ["langextract>=1.6"]
# A local encoder: CPU-only, no API key, no network. Pulls in PyTorch.
gliner = ["gliner2"]
# A general model through Simon Willison's llm and its plugin ecosystem. The
# provider plugins are separate installs by design -- pick the ones you use:
#   pip install llm-anthropic llm-gemini llm-openrouter llm-ollama llm-mistral
chat = ["llm>=0.20"]
# Layout-aware parsing: page structure, reading order, tables, and OCR for
# scanned pages. Heavy (ML models fetched on first run), so it is opt-in and
# the pdftotext path stays as the fallback.
layout = ["docling>=2"]
# Fuzzy name matching for entity resolution candidates. Optional: without it,
# candidates come from exact keys and stated identifiers only, which is what
# everything else is built on. `datasette-rapidfuzz` exposes the same functions
# as SQL for ad-hoc exploration, and is not needed by the core.
match = ["rapidfuzz>=3"]
# Claude through the official SDK. `chat` already reaches Anthropic through an
# OpenAI-compatible front, so this is here for one reason: an identity-linked
# API key requires an `anthropic-workspace-id` header on every request, and
# neither `chat` nor `llm-anthropic` can carry one.
anthropic = ["anthropic>=1"]
# Graph analysis beyond the deterministic core. Louvain in place of label
# propagation (much more stable, and it reports modularity so a reader can see
# whether the partition means anything), and betweenness centrality. Without it
# components, articulation points, paths, isolates and degree all still work --
# a store has to be readable structurally by a script with nothing installed.
graph = ["networkx>=3"]
# Full-text search over page text and excerpts. sqlite-utils owns the FTS
# triggers and the query escaping; writing those by hand is possible and easy to
# get subtly wrong.
search = ["sqlite-utils>=3.36"]
# Renaming, dropping or retyping a property on a table that already holds rows.
# SQLite cannot do it in place, and the create/copy/drop/rename dance has to
# preserve indexes and foreign keys. Same package as `search`.
schema = ["sqlite-utils>=3.36"]
pdf = ["pdfminer.six"]
ocr = ["pytesseract", "pillow"]
dev = ["pytest>=7", "datasette>=1.0a32", "httpx", "pyyaml", "jsonschema",
       "langextract>=1.6", "llm>=0.20", "llm-echo", "sqlite-utils>=3.36",
       "rapidfuzz>=3", "networkx>=3", "datasette-cron>=0.0.1a2"]

[project.scripts]
orpheus = "orpheus.cli:cli"

[tool.setuptools.packages.find]
include = ["orpheus*"]

[tool.setuptools.package-data]
# schemas/ included deliberately: validate() reads the vendored ontologySpecR
# schema at runtime, so an installed copy without it cannot validate a bundle.
orpheus = ["bundles/*.json", "benchmarks/*.json", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
