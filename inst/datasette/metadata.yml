title: "Orpheus: Core contract ontology"
description_html: |-
    <p>Read-only view of the Orpheus store. Every write goes through the single writer; this process only reads.</p>
    <p>AI-sourced rows carry <code>source</code>, <code>confidence</code> and <code>status</code>. A row with <code>status = unconfirmed</code> has not been checked by a person. <code>confidence</code> is one of five rubric levels, not an arbitrary score: 1.0 explicit, 0.9 clearly named, 0.7 implied, 0.5 inferred, 0.2 speculative.</p>
databases:
  orpheus:
    tables:
      documents:
        description: "One row per ingested document. review_status is the document-level flag; per-instance review state lives on the instance tables."
      provenance:
        description: "What the machine said, and where it read it. Never changed by a correction \u2014 the instance row carries the current values, this row carries the original."
      edit_history:
        description: "Append-only. Ordered by seq rather than timestamp, because changes made in one transaction share a timestamp to the second."
      schema_amendments:
        description: "Properties and types seen during extraction but not declared in the bundle. Accepting one changes the bundle for every document."
      concept_evaluations:
        description: "stale = 1 means an instance this read has since been amended."
      llm_calls:
        description: "Every model call, local and cloud, attempted or succeeded."
